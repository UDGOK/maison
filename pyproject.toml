[project]
name = "maison_pos"
authors = [
    { name = "Maison", email = "dev@maison.example" }
]
description = "Maison POS — offline-first luxury retail point of sale for Frappe / ERPNext v15"
requires-python = ">=3.10"
readme = "maison_pos/README_BACKEND.md"
dynamic = ["version"]
dependencies = [
    "stripe>=7.0,<12",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "maison_pos"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
