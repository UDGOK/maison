<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0A1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>{{ title }}</title>
    <script>
      // Injected by www/pos.py; consumed by frontend/src/api/frappe.ts
      window.csrf_token = "{{ csrf_token }}";
      window.maison_user = "{{ site_user }}";
    </script>
    {{ head_tags | safe }}
    <style>
      html, body { background: #0A1410; color: #E9ECE6; margin: 0; height: 100%; font-family: Jost, Helvetica, Arial, sans-serif; }
      .maison-fallback { padding: 48px; max-width: 640px; }
      .maison-fallback h1 { font-family: Unbounded, "Arial Black", sans-serif; letter-spacing: .3em; font-weight: 900; }
      .maison-fallback code { color: #9FB3A6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    {% if built %}
      {{ body_tags | safe }}
    {% else %}
      <div class="maison-fallback">
        <h1>MAISON</h1>
        <p>{{ build_hint }}</p>
        <p><code>cd frontend && npm i && npm run build</code></p>
      </div>
    {% endif %}
  </body>
</html>
